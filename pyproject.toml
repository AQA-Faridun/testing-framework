[project]
name = "testing-framework"
version = "0.1.0"
description = "Black-box test automation framework: API (httpx), Web (Playwright), Allure Report 3"
requires-python = ">=3.12"
dependencies = [
    "allure-pytest>=2.16.2",
    "appium-python-client>=6.1.5",
    "httpx>=0.28.1",
    "mimesis>=22.2.0",
    "playwright>=1.64.1",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "pytest>=8.4,<9",
    "pytest-playwright>=0.10.0",
    "pytest-rerunfailures>=16.7",
    "pytest-xdist>=3.8.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
minversion = "8.4"
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "-s",
    "--tb=short",
    "--import-mode=importlib",
    "--strict-markers",
    "--strict-config",
    "--alluredir=allure-results",
    "--clean-alluredir",
    # Demo tests fail on purpose; an explicit -m on the command line overrides this.
    "-m",
    "not demo",
]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)s] %(message)s"
log_format = "%(asctime)s [%(levelname)s] %(message)s"
log_date_format = "%H:%M:%S"
markers = [
    "smoke: quick checks, smoke testing (not yet used)",
    "regression: regression testing, verifying existing functionality still works (not yet used)",
    "api_positive: all positive tests (business flow) across all services",
    "api_negative: all negative tests (validation) across all services",
    "web_positive: all positive Web UI tests across all sections",
    "web_negative: all negative Web UI tests across all sections",
    "mobile_positive: all positive Mobile tests across all sections",
    "mobile_negative: all negative Mobile tests across all sections",
    "demo: demo tests that show every Allure status, some fail on purpose (excluded by default)",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PT", "RUF"]
# Cyrillic letters in strings and docstrings are intended.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
files = ["."]
exclude = ["^\\.venv/", "^node_modules/"]
explicit_package_bases = true
strict = true
plugins = ["pydantic.mypy"]
# allure-python ships no type hints; its decorators and calls would otherwise fail strict mode.
untyped_calls_exclude = ["allure", "allure_commons"]
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["allure", "allure_commons.*", "mimesis.*"]
ignore_missing_imports = true
